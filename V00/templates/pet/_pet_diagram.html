{# Pet Zone Diagram - Interactive SVG Dog "Butcher Chart" #}
{# For segment "Chó" - zones mapped to dog body areas #}

<div class="pet-diagram-wrap">
  <div class="cd-title">📐 Sơ đồ chăm sóc — <strong>{{ segment.name }}</strong></div>
  <div class="cd-subtitle">Di chuột hoặc chạm vào vùng trên hình để xem chi tiết</div>

  <svg class="pet-diagram-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="petGround" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="transparent"/>
        <stop offset="20%" stop-color="var(--cd-ground)"/>
        <stop offset="80%" stop-color="var(--cd-ground)"/>
        <stop offset="100%" stop-color="transparent"/>
      </linearGradient>
    </defs>

    <!-- Ground -->
    <ellipse cx="400" cy="430" rx="320" ry="10" fill="url(#petGround)" opacity="0.25"/>

    <!-- ═══ DOG BODY ═══ -->
    <!-- Body (torso) -->
    <path class="pet-body" d="
      M 250,200
      C 250,170 280,140 320,130
      L 500,125
      C 540,128 570,145 580,170
      L 590,220
      C 595,260 580,310 560,330
      L 540,350
      L 290,360
      C 265,350 250,320 248,290
      Z
    "/>

    <!-- Head -->
    <path class="pet-body" d="
      M 320,130
      C 310,120 290,100 270,85
      C 250,70 220,60 200,65
      C 175,72 160,90 158,110
      C 155,130 165,155 180,170
      L 210,195
      L 250,200
    "/>

    <!-- Snout/Nose -->
    <path class="pet-body" d="
      M 200,65
      C 180,58 155,55 140,60
      C 125,66 115,80 120,95
      C 125,108 140,118 158,110
    "/>
    <circle class="pet-nose" cx="128" cy="76" r="8"/>

    <!-- Eye -->
    <ellipse class="pet-eye" cx="195" cy="90" rx="8" ry="9"/>
    <ellipse class="pet-pupil" cx="193" cy="89" rx="4" ry="5"/>

    <!-- Ears -->
    <path class="pet-ear" d="
      M 240,80 C 230,50 245,20 270,15 C 295,10 310,30 305,60 L 280,90
    "/>
    <path class="pet-ear" d="
      M 265,75 C 260,45 275,18 298,12 C 320,8 335,28 330,55 L 305,80
    "/>

    <!-- Tail -->
    <path class="pet-tail" d="
      M 580,170
      C 610,145 640,120 660,100
      C 675,85 685,75 690,80
      C 695,88 680,105 665,120
    "/>

    <!-- Front legs -->
    <path class="pet-body" d="M 280,340 L 275,380 C 274,395 268,410 270,420 L 290,420 C 295,410 298,395 296,380 L 300,340"/>
    <path class="pet-body" d="M 320,345 L 318,385 C 317,398 312,412 314,420 L 334,420 C 338,412 340,398 338,385 L 340,345"/>
    <!-- Back legs -->
    <path class="pet-body" d="M 500,345 L 495,365 C 490,380 480,400 478,420 L 498,420 C 502,400 508,380 510,365 L 515,345"/>
    <path class="pet-body" d="M 535,340 L 540,370 C 542,385 548,405 546,420 L 566,420 C 568,405 563,385 558,370 L 555,340"/>

    <!-- Paws -->
    <ellipse class="pet-paw" cx="280" cy="425" rx="16" ry="6"/>
    <ellipse class="pet-paw" cx="324" cy="425" rx="16" ry="6"/>
    <ellipse class="pet-paw" cx="488" cy="425" rx="16" ry="6"/>
    <ellipse class="pet-paw" cx="556" cy="425" rx="16" ry="6"/>

    <!-- ═══ ZONE OVERLAYS ═══ -->
    {% for z in segment.zones %}
    <a href="{{ url_for('pet_zone', segment_slug=segment.slug, zone_slug=z.slug) }}" class="pet-zone-link">
      <g class="pet-zone-group {% if active_zone_slug is defined and active_zone_slug == z.slug %}active{% endif %}"
         data-zone="{{ z.slug }}" data-name="{{ z.name }}" data-color="{{ z.color }}">

        {% if z.slug == 'dinh-duong' %}
        <!-- Dinh dưỡng: Belly/stomach area -->
        <ellipse class="zone-fill" cx="420" cy="290" rx="100" ry="55"/>
        <circle class="zone-dot" cx="420" cy="290" r="6"/>
        <text class="zone-label" x="420" y="295">{{ z.icon }} Dinh dưỡng</text>

        {% elif z.slug == 'y-te' %}
        <!-- Y tế: Heart/chest area -->
        <ellipse class="zone-fill" cx="340" cy="210" rx="70" ry="50"/>
        <circle class="zone-dot" cx="340" cy="210" r="6"/>
        <text class="zone-label" x="340" y="215">{{ z.icon }} Y tế</text>

        {% elif z.slug == 'huan-luyen' %}
        <!-- Huấn luyện: Head/brain area -->
        <ellipse class="zone-fill" cx="220" cy="100" rx="55" ry="45"/>
        <circle class="zone-dot" cx="220" cy="100" r="6"/>
        <text class="zone-label" x="220" y="105">{{ z.icon }} Huấn luyện</text>

        {% elif z.slug == 'do-dung' %}
        <!-- Đồ dùng: Neck collar + paws area -->
        <rect class="zone-fill" x="240" y="165" width="60" height="35" rx="12"/>
        <rect class="zone-fill" x="256" y="410" width="320" height="25" rx="8"/>
        <circle class="zone-dot" cx="270" cy="182" r="6"/>
        <text class="zone-label" x="270" y="160">{{ z.icon }} Đồ dùng</text>

        {% else %}
        <ellipse class="zone-fill" cx="400" cy="250" rx="60" ry="40"/>
        <text class="zone-label" x="400" y="255">{{ z.icon }} {{ z.name[:10] }}</text>
        {% endif %}
      </g>
    </a>
    {% endfor %}

    <!-- Collar accent -->
    <path class="pet-collar" d="M 248,190 C 255,175 270,165 290,162 L 295,172 C 275,175 260,183 254,196 Z"/>

  </svg>

  <!-- Legend -->
  <div class="cd-legend">
    {% for z in segment.zones %}
    <a href="{{ url_for('pet_zone', segment_slug=segment.slug, zone_slug=z.slug) }}"
       class="cd-legend-item {% if active_zone_slug is defined and active_zone_slug == z.slug %}active{% endif %}"
       data-zone="{{ z.slug }}"
       onmouseenter="highlightPetZone('{{ z.slug }}')" onmouseleave="unhighlightPetZone('{{ z.slug }}')">
      <span class="cd-legend-dot" style="background:{{ z.color }}"></span>
      <span class="cd-legend-name">{{ z.name }}</span>
      <span class="cd-legend-count">{{ z.parts|length }}</span>
    </a>
    {% endfor %}
  </div>
</div>

<script>
document.querySelectorAll('.pet-zone-group').forEach(g => {
  const slug = g.dataset.zone;
  g.addEventListener('mouseenter', () => {
    g.classList.add('hover');
    document.querySelectorAll(`.cd-legend-item[data-zone="${slug}"]`).forEach(l => l.classList.add('hover'));
  });
  g.addEventListener('mouseleave', () => {
    g.classList.remove('hover');
    document.querySelectorAll(`.cd-legend-item[data-zone="${slug}"]`).forEach(l => l.classList.remove('hover'));
  });
});
function highlightPetZone(slug) { document.querySelectorAll(`.pet-zone-group[data-zone="${slug}"]`).forEach(g => g.classList.add('hover')); }
function unhighlightPetZone(slug) { document.querySelectorAll(`.pet-zone-group[data-zone="${slug}"]`).forEach(g => g.classList.remove('hover')); }
</script>
