<!-- AI Assistant Chat Widget -->
<div id="aiChatWidget" class="ai-chat-widget">
  <!-- Toggle Button -->
  <button id="chatToggle" class="chat-toggle" title="AI Assistant">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <span class="chat-badge" id="chatBadge" style="display:none"></span>
  </button>

  <!-- Chat Window -->
  <div id="chatWindow" class="chat-window" style="display:none">
    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-content">
        <div class="chat-avatar">🤖</div>
        <div>
          <div class="chat-title">AI Assistant</div>
          <div class="chat-status">Ready to help</div>
        </div>
      </div>
      <button id="chatClose" class="chat-close">×</button>
    </div>

    <!-- Messages -->
    <div id="chatMessages" class="chat-messages">
      <div class="chat-message bot">
        <div class="message-avatar">🤖</div>
        <div class="message-content">
          <div class="message-text">
            Xin chào! Em là AI Assistant. Em có thể giúp anh:
            <ul style="margin:8px 0;padding-left:20px;font-size:14px">
              <li>Viết bài viết mới</li>
              <li>Thêm/xóa sản phẩm</li>
              <li>Tạo vertical mới</li>
              <li>Phân tích data</li>
              <li>Và nhiều task khác...</li>
            </ul>
            Anh cần em giúp gì ạ?
          </div>
          <div class="message-time">now</div>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input">
      <textarea id="chatInputText" placeholder="Nhập yêu cầu của anh..." rows="1"></textarea>
      <button id="chatSend" class="chat-send-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

    <!-- Quick Actions -->
    <div class="chat-quick-actions">
      <button class="quick-action" data-prompt="Viết bài về {{ current_vertical }}">✍️ Viết bài</button>
      <button class="quick-action" data-prompt="Thêm sản phẩm mới">➕ Thêm SP</button>
      <button class="quick-action" data-prompt="Phân tích dashboard">📊 Phân tích</button>
    </div>
  </div>
</div>

<style>
/* Chat Widget Styles */
.ai-chat-widget {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  font-family: 'DM Sans', -apple-system, system-ui, sans-serif;
}

.chat-toggle {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border: none;
  color: white;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  position: relative;
}

.chat-toggle:hover {
  transform: scale(1.1);
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
}

.chat-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: #e74c3c;
  color: white;
  border-radius: 10px;
  padding: 2px 6px;
  font-size: 14px;
  font-weight: 600;
}

.chat-window {
  position: absolute;
  bottom: 72px;
  right: 0;
  width: 400px;
  max-height: 600px;
  background: var(--surface);
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
}

.chat-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-radius: 12px 12px 0 0;
}

.chat-header-content {
  display: flex;
  align-items: center;
  gap: 12px;
}

.chat-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.chat-title {
  font-weight: 600;
  font-size: 15px;
}

.chat-status {
  font-size: 14px;
  opacity: 0.9;
}

.chat-close {
  background: none;
  border: none;
  color: white;
  font-size: 28px;
  cursor: pointer;
  padding: 0;
  width: 32px;
  height: 32px;
  line-height: 1;
  border-radius: 4px;
  transition: background 0.2s;
}

.chat-close:hover {
  background: rgba(255, 255, 255, 0.2);
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-height: 400px;
  min-height: 300px;
}

.chat-message {
  display: flex;
  gap: 12px;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.chat-message.user {
  flex-direction: row-reverse;
}

.message-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--accent-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.chat-message.user .message-avatar {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

.message-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.chat-message.user .message-content {
  align-items: flex-end;
}

.message-text {
  background: var(--bg-subtle);
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
  max-width: 280px;
  word-wrap: break-word;
}

.chat-message.user .message-text {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
}

.message-text.loading {
  display: flex;
  gap: 4px;
  padding: 14px;
}

.loading-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-secondary);
  animation: bounce 1.4s infinite ease-in-out both;
}

.loading-dot:nth-child(1) { animation-delay: -0.32s; }
.loading-dot:nth-child(2) { animation-delay: -0.16s; }

@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

.message-time {
  font-size: 14px;
  color: var(--text-secondary);
  padding: 0 4px;
}

.chat-input {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.chat-input textarea {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  max-height: 120px;
  background: var(--bg);
  color: var(--text);
}

.chat-input textarea:focus {
  outline: none;
  border-color: var(--accent);
}

.chat-send-btn {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  border: none;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.chat-send-btn:hover {
  transform: scale(1.05);
}

.chat-send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.chat-quick-actions {
  padding: 8px 16px 12px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  border-top: 1px solid var(--border);
}

.quick-action {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.quick-action:hover {
  background: var(--accent-bg);
  border-color: var(--accent);
  color: var(--accent);
}
</style>

<script>
// Chat Widget JavaScript
(function() {
  const chatToggle = document.getElementById('chatToggle');
  const chatWindow = document.getElementById('chatWindow');
  const chatClose = document.getElementById('chatClose');
  const chatMessages = document.getElementById('chatMessages');
  const chatInputText = document.getElementById('chatInputText');
  const chatSend = document.getElementById('chatSend');
  const quickActions = document.querySelectorAll('.quick-action');

  // Toggle chat window
  chatToggle.addEventListener('click', () => {
    chatWindow.style.display = chatWindow.style.display === 'none' ? 'flex' : 'none';
    if (chatWindow.style.display === 'flex') {
      chatInputText.focus();
    }
  });

  chatClose.addEventListener('click', () => {
    chatWindow.style.display = 'none';
  });

  // Auto-resize textarea
  chatInputText.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  // Send message
  function sendMessage() {
    const message = chatInputText.value.trim();
    if (!message) return;

    // Add user message
    addMessage(message, 'user');
    chatInputText.value = '';
    chatInputText.style.height = 'auto';

    // Show loading
    const loadingId = addLoadingMessage();

    // Send to backend
    fetch('/admin/ai-chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ message: message })
    })
    .then(response => response.json())
    .then(data => {
      removeMessage(loadingId);
      addMessage(data.response, 'bot');

      // Execute action if provided
      if (data.action) {
        executeAction(data.action);
      }
    })
    .catch(error => {
      removeMessage(loadingId);
      addMessage('Xin lỗi, có lỗi xảy ra. Vui lòng thử lại.', 'bot');
      console.error('Error:', error);
    });
  }

  chatSend.addEventListener('click', sendMessage);

  chatInputText.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Quick actions
  quickActions.forEach(btn => {
    btn.addEventListener('click', () => {
      chatInputText.value = btn.dataset.prompt;
      sendMessage();
    });
  });

  // Helper functions
  function addMessage(text, type) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `chat-message ${type}`;
    messageDiv.innerHTML = `
      <div class="message-avatar">${type === 'bot' ? '🤖' : '👤'}</div>
      <div class="message-content">
        <div class="message-text">${escapeHtml(text)}</div>
        <div class="message-time">${new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute: '2-digit'})}</div>
      </div>
    `;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return messageDiv;
  }

  function addLoadingMessage() {
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'chat-message bot';
    loadingDiv.id = 'loading-' + Date.now();
    loadingDiv.innerHTML = `
      <div class="message-avatar">🤖</div>
      <div class="message-content">
        <div class="message-text loading">
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
        </div>
      </div>
    `;
    chatMessages.appendChild(loadingDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return loadingDiv.id;
  }

  function removeMessage(id) {
    const msg = document.getElementById(id);
    if (msg) msg.remove();
  }

  function executeAction(action) {
    if (action.type === 'redirect') {
      setTimeout(() => {
        window.location.href = action.url;
      }, 1000);
    } else if (action.type === 'refresh') {
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML.replace(/\n/g, '<br>');
  }
})();
</script>
