    <text id="mapTooltipText" x="0" y="0" class="prov-label" style="font-size:14px;font-weight:600">...</text>
  </g>

<script>
(function(){
  var svg = document.querySelector('.vn-map-svg');
  if (!svg) return;
  var tip = document.getElementById('mapTooltip');
  var tipBg = document.getElementById('mapTooltipBg');
  var tipTxt = document.getElementById('mapTooltipText');

  /* ── Auto-zoom to active province ── */
  var activeSlug = '{{ active_province|default("") }}';
  var originalVB = '0 0 440 710';

  if (activeSlug) {
    var activeG = svg.querySelector('.prov-shape[data-slug="' + activeSlug + '"]');
    if (activeG) {
      var path = activeG.querySelector('.prov-path');
      if (path) {
        /* Wait for SVG to render so getBBox works */
        setTimeout(function() {
          try {
            var bb = path.getBBox();
            var pad = 60;
            var vx = Math.max(0, bb.x - pad);
            var vy = Math.max(0, bb.y - pad);
            var vw = bb.width + pad * 2;
            var vh = bb.height + pad * 2;
            /* Keep aspect ratio reasonable (min size) */
            if (vw < 160) { vx -= (160 - vw) / 2; vw = 160; }
            if (vh < 200) { vy -= (200 - vh) / 2; vh = 200; }
            /* Clamp within full map */
            if (vx < 0) vx = 0;
            if (vy < 0) vy = 0;
            if (vx + vw > 440) vw = 440 - vx;
            if (vy + vh > 710) vh = 710 - vy;
            svg.setAttribute('viewBox', vx + ' ' + vy + ' ' + vw + ' ' + vh);
          } catch(e) {}
        }, 50);
      }
    }
  }

  /* ── Reset zoom button ── */
  var mapCard = svg.closest('.hpm-map-card');
  if (mapCard && activeSlug) {
    var resetBtn = document.createElement('button');
    resetBtn.textContent = 'Xem toan bo';
    resetBtn.className = 'btn btn-ghost';
    resetBtn.style.cssText = 'position:absolute;top:8px;right:8px;z-index:5;font-size:12px;padding:4px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;cursor:pointer;opacity:0.85';
    mapCard.style.position = 'relative';
    mapCard.appendChild(resetBtn);
    var zoomed = true;
    resetBtn.addEventListener('click', function() {
      if (zoomed) {
        svg.setAttribute('viewBox', originalVB);
        resetBtn.textContent = 'Zoom tinh';
        zoomed = false;
      } else {
        /* Re-zoom to province */
        var g = svg.querySelector('.prov-shape[data-slug="' + activeSlug + '"]');
        if (g) {
          var p = g.querySelector('.prov-path');
          if (p) {
            var bb = p.getBBox();
            var pad = 60;
            var vx = Math.max(0, bb.x - pad);
            var vy = Math.max(0, bb.y - pad);
            var vw = bb.width + pad * 2;
            var vh = bb.height + pad * 2;
            if (vw < 160) { vx -= (160 - vw) / 2; vw = 160; }
            if (vh < 200) { vy -= (200 - vh) / 2; vh = 200; }
            if (vx < 0) vx = 0;
            if (vy < 0) vy = 0;
            if (vx + vw > 440) vw = 440 - vx;
            if (vy + vh > 710) vh = 710 - vy;
            svg.setAttribute('viewBox', vx + ' ' + vy + ' ' + vw + ' ' + vh);
          }
        }
        resetBtn.textContent = 'Xem toan bo';
        zoomed = true;
      }
    });
  }

  /* ── Tooltip hover ── */
  if (!tip) return;
  svg.querySelectorAll('.prov-shape').forEach(function(g){
    var titleEl = g.querySelector('title');
    if (!titleEl) return;
    var name = titleEl.textContent;

    g.addEventListener('mouseenter', function(e){
      var path = g.querySelector('.prov-path');
      if (!path) return;
      var bb = path.getBBox();
      var cx = bb.x + bb.width / 2;
      var cy = bb.y - 4;

      tipTxt.textContent = name;
      var tbb = tipTxt.getBBox();
      var pw = tbb.width + 14;
      var ph = 22;

      var tx = cx - pw / 2;
      if (tx < 4) tx = 4;
      if (tx + pw > 436) tx = 436 - pw;
      var ty = cy - ph;
      if (ty < 4) ty = bb.y + bb.height + 4;

      tipBg.setAttribute('x', tx);
      tipBg.setAttribute('y', ty);
      tipBg.setAttribute('width', pw);
      tipBg.setAttribute('height', ph);
      tipTxt.setAttribute('x', tx + pw / 2);
      tipTxt.setAttribute('y', ty + 15);
      tip.style.display = '';
    });

    g.addEventListener('mouseleave', function(){
      tip.style.display = 'none';
    });
  });
})();
</script>
